name: Native runtime configuration

on:
  pull_request:
    paths:
      - app.config.js
      - eas.json
      - package.json
      - package-lock.json
      - plugins/**
      - scripts/validate-expo-runtime.mjs
  push:
    branches: [main]
    paths:
      - app.config.js
      - eas.json
      - package.json
      - package-lock.json
      - plugins/**
      - scripts/validate-expo-runtime.mjs

permissions:
  contents: read

jobs:
  validate-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run config:runtime
